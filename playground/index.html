<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GHC in the browser</title>
<style>
  :root { color-scheme: light dark; --edge: #8883; --hover: #8882; --active: #4a90e233; }
  body { margin: 0; font: 14px/1.5 ui-sans-serif, system-ui, sans-serif; height: 100vh; display: grid; grid-template-rows: auto auto 1fr; }
  header { display: flex; gap: .75rem; align-items: center; padding: .6rem .9rem; border-bottom: 1px solid var(--edge); flex-wrap: wrap; }
  h1 { font-size: 1rem; margin: 0 .5rem 0 0; font-weight: 600; }
  button, select { font: inherit; padding: .3rem .8rem; border: 1px solid var(--edge); border-radius: 6px; background: transparent; color: inherit; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  #status { color: #888; margin-left: auto; }
  #path { color: #888; font: 12px ui-monospace, monospace; padding: .35rem .8rem; border-bottom: 1px solid var(--edge); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  main { display: flex; min-height: 0; }
  #sidebar { width: 220px; flex: 0 0 220px; overflow: auto; border-right: 1px solid var(--edge); }
  #sidebar.collapsed { display: none; }
  #sidebar.collapsed + .resizer { display: none; }
  .resizer { flex: 0 0 5px; width: 5px; cursor: col-resize; background: transparent; touch-action: none; }
  .resizer:hover, .resizer.active { background: var(--active); }
  body.resizing { cursor: col-resize; user-select: none; }
  #sidebar-head { display: flex; justify-content: space-between; align-items: center; padding: .5rem .7rem; font-size: 12px; color: #888; }
  #sidebar-head button { padding: 0 .4rem; border: 0; }
  #tree ul { list-style: none; margin: 0; padding: 0; }
  #tree .row { padding: .15rem .6rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; font: 12px ui-monospace, monospace; }
  #tree .row:hover { background: var(--hover); }
  #tree li.file.active > .row { background: var(--active); font-weight: 600; }
  #editor, #right { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  textarea, pre { flex: 1; margin: 0; padding: .8rem; font: 13px/1.5 ui-monospace, monospace; border: 0; background: transparent; color: inherit; }
  textarea { resize: none; border-right: 1px solid var(--edge); }
  pre { overflow: auto; white-space: pre-wrap; }
  #preview { flex: 1; border: 0; background: #fff; }
  /* A miso app's preview takes the whole column; the compile log only
     reappears (see the run handler, and the message listener above) if the
     app itself has something to say - a caught error, most likely. */
  #right.split #out:empty { display: none; }
  #right.split #out:not(:empty) { flex: 0 0 8rem; overflow: auto; border-bottom: 1px solid var(--edge); }
  #files { font: 12px ui-monospace, monospace; color: #888; }
  #repo { font: inherit; padding: .3rem .8rem; border: 1px solid var(--edge); border-radius: 6px; background: transparent; color: inherit; width: 15rem; }
  #stdin-row:not([hidden]) { display: flex; border-top: 1px solid var(--edge); }
  #stdin { flex: 1; border: 0; background: transparent; color: inherit; padding: .5rem .8rem; font: 13px ui-monospace, monospace; }
  #stdin:focus { outline: 0; }
</style>

<header>
  <h1>GHC, in the browser</h1>
  <button id="sidebar-open" hidden title="Show the file list">Files</button>
  <button id="run" disabled>Compile and run</button>
  <button id="open">Open a folder…</button>
  <input id="repo" spellcheck="false" autocomplete="off" placeholder="github.com/owner/repo">
  <span id="template-row"><select id="template"><option value="prelude">Prelude</option><option value="miso">miso</option></select></span>
  <span id="files"></span>
  <span id="status">loading the compiler…</span>
</header>
<div id="path"></div>
<main>
  <nav id="sidebar">
    <div id="sidebar-head"><span>Files</span><button id="sidebar-close" title="Hide the file list">✕</button></div>
    <div id="tree"></div>
  </nav>
  <div class="resizer" id="resize-sidebar"></div>
  <div id="editor"><textarea id="source" spellcheck="false"></textarea></div>
  <div class="resizer" id="resize-editor"></div>
  <div id="right">
    <pre id="out"></pre>
    <div id="stdin-row" hidden><input id="stdin" spellcheck="false" autocomplete="off" placeholder="the program is asking for input — type a line and press Enter"></div>
    <iframe id="preview" hidden title="program preview"></iframe>
  </div>
</main>

<script type="module">
import { Vfs } from "./vfs.mjs";
import { makeStdin, runCompiler } from "./host.mjs";
import { findEntry, haskellSources, mountDirectory, mountGitHub, neededPackages, parseGitHubUrl, pinnedMiso, usesTemplateHaskell } from "./project.mjs";

const $ = (id) => document.getElementById(id);
const say = (t) => ($("status").textContent = t);
const print = (t) => { $("out").textContent += t; $("out").scrollTop = $("out").scrollHeight; };
const enc = (s) => new TextEncoder().encode(s);
const dec = (b) => new TextDecoder().decode(b);
const escapeHtml = (s) => s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

const TEMPLATES = {
  prelude: `module Main where

main :: IO ()
main = putStrLn (unwords (map show (take 10 primes)))
  where
    primes = sieve [2 ..]
    sieve (p : xs) = p : sieve [x | x <- xs, x \`mod\` p /= 0]
    sieve [] = []
`,
  miso: `{-# LANGUAGE OverloadedStrings #-}
{-# LANGUAGE LambdaCase #-}
module Main where

import Miso
import qualified Miso.Html as H

data Action = AddOne | SubtractOne

main :: IO ()
main = startApp defaultEvents (component (0 :: Int) updateModel viewModel) { mountPoint = Just "app" }

updateModel :: Action -> Effect () () Int Action
updateModel = \\case
  AddOne      -> modify (+ 1)
  SubtractOne -> modify (subtract 1)

viewModel :: () -> () -> Int -> View () Int Action
viewModel _ _ n =
  H.div_ [] [ H.button_ [ H.onClick AddOne ] [ "+" ], text (ms n), H.button_ [ H.onClick SubtractOne ] [ "-" ] ]
`,
};

/**
 * `-ddisable-js-c-sources` (see build/README.md) leaves out the JavaScript
 * GHC's linker would have made from a package's C sources, so anything a
 * program reaches through one has to be supplied here instead. splitmix's is
 * a single function - 64 bits of seed, high word returned and low word left
 * in `h$ret1` - and `initStdGen` sits on top of it, which is every
 * `randomRIO` and `newStdGen` a program might call.
 */
const SPLITMIX_SHIM = "function h$splitmix_init(){h$ret1=(Math.random()*4294967296)>>>0;return (((Date.now()>>>0)^(Math.random()*4294967296))>>>0);}\n";

/** The above plus `assets/jsbi-shim.js`, which the compiler bundle already
 * carries and a compiled program needs for the same reason: GHC's RTS calls
 * `JSBI.*` in its 64-bit helpers and nothing defines it. */
let C_SHIMS = SPLITMIX_SHIM;

/** A stall, not just a failure, is the failure mode a fetch of 100+ MB
 * actually has: the connection sits open with nothing arriving, and `fetch`
 * on its own waits forever. `onProgress` resets the clock on every chunk, so
 * this only fires when nothing has arrived for a while - a slow transfer
 * keeps going as long as bytes keep coming. */
const STALL_MS = 20_000;

const fetchBytes = async (url, onProgress) => {
  const controller = new AbortController();
  let stall = setTimeout(() => controller.abort(new Error(`${url} stalled: nothing arrived for ${STALL_MS / 1000}s`)), STALL_MS);
  try {
    const res = await fetch(url, { signal: controller.signal });
    if (!res.ok) throw new Error(`${res.status} ${res.statusText} for ${new URL(url, location.href)}`);
    const total = Number(res.headers.get("content-length")) || 0;
    const chunks = [];
    let got = 0;
    for await (const chunk of res.body) {
      clearTimeout(stall);
      stall = setTimeout(() => controller.abort(new Error(`${url} stalled: nothing arrived for ${STALL_MS / 1000}s`)), STALL_MS);
      chunks.push(chunk);
      got += chunk.length;
      // A percentage when the server sent a length; downloaded-so-far when it
      // did not, so "no visible number moving" never means "no visible sign
      // of life" - those look identical otherwise on a many-second transfer.
      onProgress?.(total ? { pct: got / total } : { mb: got / 1e6 });
    }
    const all = new Uint8Array(got);
    let at = 0;
    for (const c of chunks) { all.set(c, at); at += c.length; }
    return all;
  } catch (e) {
    throw e.name === "AbortError" && controller.signal.reason ? controller.signal.reason : e;
  } finally {
    clearTimeout(stall);
  }
};

/** Cloudflare Pages refuses any file over 25 MiB, so pack-assets.mjs splits
 * each blob into `${base}.0`, `${base}.1`, … - `${base}.chunks.json` says
 * how many to fetch, in order, before they are reassembled into one blob. */
const fetchChunked = async (base, onProgress) => {
  const n = Number(await fetch(`${base}.chunks.json`).then((r) => (r.ok ? r.text() : Promise.reject(new Error(`${r.status} for ${base}.chunks.json`)))));
  const parts = new Array(n);
  let total = 0;
  for (let i = 0; i < n; i++) {
    parts[i] = await fetchBytes(`${base}.${i}`, (p) => onProgress?.({ pct: (i + (p.pct ?? 0)) / n }));
    total += parts[i].length;
  }
  const all = new Uint8Array(total);
  let at = 0;
  for (const p of parts) { all.set(p, at); at += p.length; }
  return all;
};

const pct = (x) => `${Math.round(x * 100)}%`;
const progress = (label) => (p) => say(`${label} ${"pct" in p ? pct(p.pct) : `${p.mb.toFixed(0)} MB`}`);

// A running miso app's own uncaught errors, forwarded from its iframe (see
// the srcdoc built in the run handler below).
addEventListener("message", (e) => {
  if (e.source === $("preview")?.contentWindow && e.data?.ghctsPreviewError) print(`\npreview error: ${e.data.ghctsPreviewError}\n`);
});

/** What packages the second blob would bring, if it were fetched. Written by
 * `pack-assets.mjs --miso`; without it there is no `miso.bin` either, so an
 * empty index and "no extra packages available" are the same answer. */
const EMPTY_PKGS = { expose: [], boot: [], modules: {}, alternates: {} };

say("fetching the compiler…");
let source, libBin, libIndex, pkgIndex, jsbi;
try {
  [source, libBin, libIndex, pkgIndex, jsbi] = await Promise.all([
    fetchChunked("./assets/ghc.cjs", progress("compiler")).then(dec),
    fetchChunked("./assets/lib.bin", progress("libraries")),
    fetch("./assets/lib.json").then((r) => (r.ok ? r.json() : Promise.reject(new Error(`${r.status} for lib.json`)))),
    fetch("./assets/pkgs.json").then((r) => (r.ok ? r.json() : EMPTY_PKGS)).catch(() => EMPTY_PKGS),
    fetch("./assets/jsbi-shim.js").then((r) => (r.ok ? r.text() : Promise.reject(new Error(`${r.status} for jsbi-shim.js`)))),
  ]);
  C_SHIMS = `${jsbi}\n${SPLITMIX_SHIM}`;
} catch (e) {
  // The run button stays disabled: there is nothing to run.
  say(`could not load: ${e.message}`);
  throw e;
}

/** The libraries are one blob; each file is a slice, decoded on first read. */
const vfs = new Vfs();
for (const { path, offset, size } of libIndex)
  vfs.writeFile(`/lib/${path}`, { size, load: () => libBin.subarray(offset, offset + size) }, 1_600_000_000_000);
vfs.mkdirp("/work");
vfs.mkdirp("/tmp");
vfs.cwd = "/work";

/** A blob of libraries, fetched the first time something needs it and mounted
 * where its index says. `miso` is the big one - miso itself, the boot packages
 * beyond the Prelude's, and GHC's interpreter - and each `miso-<ref>` is a
 * second miso for a project that pins that revision. */
const blobs = new Map();
const ensureBlob = (name) => {
  if (!blobs.has(name))
    blobs.set(
      name,
      (async () => {
        try {
          const [bin, index] = await Promise.all([
            fetchChunked(`./assets/${name}.bin`, progress(name)),
            fetch(`./assets/${name}.json`).then((r) => (r.ok ? r.json() : Promise.reject(new Error(`${r.status} for ${name}.json`)))),
          ]);
          for (const { path, offset, size } of index)
            vfs.writeFile(`/lib/${path}`, { size, load: () => bin.subarray(offset, offset + size) }, 1_600_000_000_000);
        } catch (e) {
          // A one-time network hiccup should not wedge this blob for the rest
          // of the session: without this the rejected promise would stay in
          // the map, and every later attempt would fail without trying again.
          blobs.delete(name);
          throw e;
        }
      })(),
    );
  return blobs.get(name);
};
const ensureMiso = () => ensureBlob("miso");

// --- the file tree, and the one open editor over whichever file is current ---

const editor = $("source");
/** "/work" for a template, "/project" once a folder is opened. */
let root = "/work";
let currentPath;
/** Real files a folder picker handed us, so edits can be written back to disk. */
let fileHandles = new Map();
/** What findEntry() decided about an opened project, or undefined until then. */
let project;
/** Where a repo's own files live, so a preview's relative `assets/…` URLs
 * resolve against the repository rather than against this page. */
let projectBase;
/** Toggled by clicking a folder row in the tree. */
const collapsedDirs = new Set();
let previewUrl;

async function saveCurrent() {
  if (!currentPath) return;
  const bytes = enc(editor.value);
  vfs.writeFile(currentPath, bytes);
  const handle = fileHandles.get(currentPath);
  if (handle) {
    try {
      const w = await handle.createWritable();
      await w.write(bytes);
      await w.close();
    } catch (e) {
      // Best effort: permission can be revoked mid-session, or the browser
      // granted read-only access. The edit still lives in the VFS either way.
      console.warn(`could not save ${currentPath} to disk:`, e);
    }
  }
}

function openFile(path) {
  currentPath = path;
  editor.value = dec(vfs.readFile(path));
  $("path").textContent = path;
  renderTree();
}

function nodeHtml(path, node, depth) {
  const name = path.slice(path.lastIndexOf("/") + 1);
  const pad = `style="padding-left:${depth * 14 + 6}px"`;
  if (node.children) {
    const isCollapsed = collapsedDirs.has(path);
    const entries = [...node.children.entries()].sort(([an, a], [bn, b]) => (!!a.children === !!b.children ? an.localeCompare(bn) : a.children ? -1 : 1));
    const kids = isCollapsed ? "" : `<ul>${entries.map(([n, c]) => nodeHtml(`${path}/${n}`, c, depth + 1)).join("")}</ul>`;
    return `<li class="dir" data-path="${escapeHtml(path)}" data-kind="dir"><div class="row" ${pad}>${isCollapsed ? "▸" : "▾"} ${escapeHtml(name)}/</div>${kids}</li>`;
  }
  return `<li class="file${path === currentPath ? " active" : ""}" data-path="${escapeHtml(path)}" data-kind="file"><div class="row" ${pad}>${escapeHtml(name)}</div></li>`;
}

function renderTree() {
  const rootNode = vfs.lookup(root);
  if (!rootNode?.children) { $("tree").innerHTML = ""; return; }
  const entries = [...rootNode.children.entries()].sort(([an, a], [bn, b]) => (!!a.children === !!b.children ? an.localeCompare(bn) : a.children ? -1 : 1));
  $("tree").innerHTML = `<ul>${entries.map(([n, c]) => nodeHtml(`${root}/${n}`, c, 0)).join("")}</ul>`;
}

$("tree").addEventListener("click", async (e) => {
  const row = e.target.closest("[data-path]");
  if (!row) return;
  const path = row.dataset.path;
  if (row.dataset.kind === "dir") {
    collapsedDirs.has(path) ? collapsedDirs.delete(path) : collapsedDirs.add(path);
    renderTree();
    return;
  }
  if (path === currentPath) return;
  await saveCurrent();
  openFile(path);
});

$("sidebar-close").onclick = () => {
  $("sidebar").classList.add("collapsed");
  $("sidebar-open").hidden = false;
};
$("sidebar-open").onclick = () => {
  $("sidebar").classList.remove("collapsed");
  $("sidebar-open").hidden = true;
};

/** Drag a divider to resize the flex box on its left. `main`'s other panes
 * (`#right` above all) never get an explicit width, so they simply take up
 * whatever the dragged ones leave behind. */
function makeResizer(handle, target, { min, max }) {
  handle.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    handle.setPointerCapture(e.pointerId);
    handle.classList.add("active");
    document.body.classList.add("resizing");
    const startX = e.clientX;
    const startWidth = target.getBoundingClientRect().width;
    const onMove = (e2) => {
      const w = Math.min(max(), Math.max(min, startWidth + (e2.clientX - startX)));
      target.style.flex = `0 0 ${w}px`;
    };
    const onUp = () => {
      handle.classList.remove("active");
      document.body.classList.remove("resizing");
      handle.removeEventListener("pointermove", onMove);
      handle.removeEventListener("pointerup", onUp);
    };
    handle.addEventListener("pointermove", onMove);
    handle.addEventListener("pointerup", onUp, { once: true });
  });
}
makeResizer($("resize-sidebar"), $("sidebar"), { min: 140, max: () => innerWidth * 0.6 });
makeResizer($("resize-editor"), $("editor"), { min: 200, max: () => innerWidth * 0.75 });

// Start on the Prelude template.
vfs.writeFile("/work/Main.hs", enc(TEMPLATES.prelude));
openFile("/work/Main.hs");
renderTree();

$("template").onchange = async () => {
  await saveCurrent();
  const kind = $("template").value;
  vfs.writeFile("/work/Main.hs", enc(TEMPLATES[kind]));
  openFile("/work/Main.hs");
  if (kind === "miso") ensureMiso();
};

say("ready");
$("run").disabled = false;

/** Throw away whatever project was mounted before. Without this a second
 * repo lands on top of the first, and the old `.cabal` still decides where
 * the program starts. */
function clearProject() {
  vfs.lookup("/project", { parent: true })?.children.delete("project");
  collapsedDirs.clear();
  currentPath = undefined;
  project = undefined;
}

/** Whatever was just mounted at /project becomes the thing that compiles. */
function adoptProject(label) {
  root = "/project";
  vfs.cwd = "/project";
  project = findEntry(vfs, "/project");
  $("template-row").hidden = true;
  $("files").textContent = label;
  $("sidebar").classList.remove("collapsed");
  $("sidebar-open").hidden = true;
  renderTree();
  if (!project) {
    currentPath = undefined;
    say("mounted, but no entry point was found — pick a file to edit");
    return;
  }
  openFile(`/project/${project.entry}`);
  say(project.usesMiso ? "mounted — a miso web app; edit and compile" : "mounted; edit and compile");
  if (project.usesMiso) ensureMiso();
}

/** Load a public repo straight from GitHub. There is no server of ours in
 * this page, and none in this either: the tree API and
 * raw.githubusercontent.com both allow cross-origin reads. */
async function loadRepo() {
  const repo = parseGitHubUrl($("repo").value);
  if (!repo) { say("that does not look like a GitHub repository"); return; }
  projectBase = `https://raw.githubusercontent.com/${repo.owner}/${repo.repo}/${repo.ref}/${repo.dir ? `${repo.dir}/` : ""}`;
  $("repo").blur();
  try {
    await saveCurrent();
    say(`fetching ${repo.owner}/${repo.repo}…`);
    clearProject();
    fileHandles = new Map(); // nothing here came off a disk we can write to
    const { count } = await mountGitHub(vfs, repo, "/project", (done, total) => say(`fetching ${repo.owner}/${repo.repo}… ${done}/${total}`));
    adoptProject(`${repo.owner}/${repo.repo} — ${count} files`);
  } catch (e) {
    say(`could not load ${repo.owner}/${repo.repo}: ${e.message}`);
  }
}
$("repo").addEventListener("keydown", (e) => { if (e.key === "Enter") loadRepo(); });

$("open").onclick = async () => {
  if (!window.showDirectoryPicker) { say("this browser has no folder picker"); return; }
  let handle;
  try {
    handle = await window.showDirectoryPicker({ mode: "readwrite" });
  } catch (e) {
    if (e.name !== "AbortError") say(`could not open a folder: ${e.message}`);
    return;
  }
  try {
    await saveCurrent();
    say("reading the folder…");
    clearProject();
    const { count, handles } = await mountDirectory(vfs, handle, "/project");
    fileHandles = handles;
    projectBase = undefined; // a picked folder is not reachable by URL
    adoptProject(`${handle.name}/ — ${count} files`);
  } catch (e) {
    say(`could not read the folder: ${e.message}`);
  }
};

$("run").onclick = async () => {
  $("run").disabled = true;
  $("out").textContent = "";
  $("stdin-row").hidden = true;
  $("preview").hidden = true;
  $("right").classList.remove("split");
  try {
    await saveCurrent();
    const inProject = root === "/project";
    const entry = inProject ? project?.entry : "Main.hs";
    if (!entry) { say("pick a file to compile"); return; }
    const includeDirs = inProject ? project?.includeDirs ?? ["."] : ["."];

    // Anything beyond the Prelude - miso, random, containers - lives in the
    // second blob. What this program imports, and what its .cabal asks for,
    // is what decides whether to fetch it and what to expose from it.
    const sources = haskellSources(vfs, root);
    const needed = neededPackages(sources, inProject ? project?.dependencies ?? [] : [], pkgIndex);
    const usesMiso = needed.includes("miso");
    // A Template Haskell splice runs in GHC's own interpreter, and the `ghci`
    // package that is rides in the same blob - nothing imports it, so nothing
    // else would have asked for it.
    const usesTH = usesTemplateHaskell(sources, inProject ? project?.extensions ?? [] : []);
    // A project that pins a revision of miso we also built gets that one. Its
    // database is stacked on top of the default, and naming the unit id is
    // what picks it - `-package miso` alone would take the newest version.
    const alternate = inProject ? pkgIndex.alternates?.[pinnedMiso(vfs, root)] : undefined;
    if (needed.length || usesTH) { say("fetching libraries…"); await ensureMiso(); }
    if (alternate) { say(`fetching miso ${alternate.blob.replace("miso-", "")}…`); await ensureBlob(alternate.blob); }

    const args = ["/lib", "-ddisable-js-c-sources", "-O0"];
    if (needed.length) args.push("-package-db", "/lib/pkgs/package.conf.d");
    if (alternate) args.push("-package-db", `/lib/${alternate.db}/package.conf.d`, "-package-id", alternate.id);
    for (const name of needed) if (pkgIndex.expose.includes(name) && !(alternate && name === "miso")) args.push("-package", name);
    if (includeDirs.length && !(includeDirs.length === 1 && includeDirs[0] === ".")) args.push(`-i${includeDirs.join(":")}`);
    args.push(...(inProject ? project?.extensions ?? [] : []));
    // Left to itself GHC names the output after the entry file and drops it
    // beside the source, so `src/Main.hs` becomes `src/Main.jsexe`. Naming it
    // instead is one less thing to guess. Clear it first: GHC links nothing
    // at all when the module it compiled is not `Main`, and running whatever
    // the *last* compile left behind is worse than saying so.
    const outDir = `${root}/ghcts-out.jsexe`;
    vfs.lookup(outDir, { parent: true })?.children.delete("ghcts-out.jsexe");
    args.push("-o", `${root}/ghcts-out`, entry);

    say("compiling…");
    const started = performance.now();
    const code = await runCompiler({ source, vfs, argv: args, onOutput: print });
    const took = ((performance.now() - started) / 1000).toFixed(1);
    if (code !== 0) {
      say(`compile failed in ${took}s`);
      // One build of miso is shipped. A project written against a different
      // revision of it fails with a plain type error and no hint as to why.
      const pin = inProject && !alternate ? pinnedMiso(vfs, root) : undefined;
      if (pin && usesMiso)
        print(`\nThis project's cabal.project pins miso at ${pin}, and the page ships one build\nof miso which is not that revision.\n`);
      return;
    }

    const allJs = `${outDir}/all.js`;
    if (!vfs.lookup(allJs)) {
      say(`compiled in ${took}s, but nothing to run`);
      print(`\nNothing was linked: ${entry} has to be \`module Main\` with a \`main\`.\n`);
      return;
    }
    const built = vfs.readFile(allJs);

    if (usesMiso) {
      // The compile log ("compilation succeeded" and the like) has done its
      // job; the app takes the whole column unless it has something to say.
      $("out").textContent = "";
      $("right").classList.add("split");
      if (previewUrl) URL.revokeObjectURL(previewUrl);
      previewUrl = URL.createObjectURL(new Blob([C_SHIMS, built], { type: "text/javascript" }));
      // srcdoc keeps the page's own origin (no `sandbox` attribute), so the
      // app's own errors can be surfaced straight into the log above it.
      $("preview").srcdoc = `<!doctype html><meta charset="utf-8">${projectBase ? `<base href="${escapeHtml(projectBase)}">` : ""}<body><div id="app"></div><script>window.onerror=(m)=>parent.postMessage({ghctsPreviewError:String(m)},"*");<\/script><script src="${previewUrl}"><\/script></body>`;
      $("preview").hidden = false;
      say(`done in ${took}s`);
    } else {
      say(`compiled in ${took}s — running`);
      // A console program can ask for input, and there is no terminal here:
      // the row below the log is stdin, one typed line at a time, echoed
      // into the log so the transcript reads the way a terminal's would.
      const io = makeStdin();
      const onKey = (e) => {
        if (e.key !== "Enter") return;
        print(`${$("stdin").value}\n`);
        io.write(enc(`${$("stdin").value}\n`));
        $("stdin").value = "";
      };
      $("stdin").addEventListener("keydown", onKey);
      $("stdin-row").hidden = false;
      $("stdin").focus();
      try {
        // The program is another node-shaped bundle; give it the same host.
        await runCompiler({ source: C_SHIMS + dec(built), vfs, argv: [], onOutput: print, stdin: io });
      } finally {
        $("stdin").removeEventListener("keydown", onKey);
        $("stdin-row").hidden = true;
      }
      say(`done in ${took}s to compile`);
    }
  } catch (e) {
    say(`failed: ${e.message}`);
    print(`\n${e.stack ?? e}\n`);
  } finally {
    $("run").disabled = false;
  }
};
</script>
